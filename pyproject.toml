[project]
name = "tasador"
version = "0.1.0"
description = "Informe de Mercado Comparativo asistido por IA para inmobiliarias"
requires-python = ">=3.12,<3.14"
# Nota: se acota a <3.14 a propósito. Tenés 3.14 instalado, pero varias
# dependencias del stack de agentes todavía no publican wheels para esa
# versión. `uv` instala y usa 3.12 solo; no hace falta que toques nada.

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # Datos
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    # Cola
    "arq>=0.26",
    "redis>=5.2",
    # Agentes
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0",
    "crewai>=0.86",
    "openai>=1.57",            # cliente OpenAI-compatible -> apunta a LiteLLM
    "instructor>=1.7",
    # Embeddings locales (costo cero)
    "fastembed>=0.4",
    # Ingesta
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "playwright>=1.49",
    "tenacity>=9.0",
    # Cálculo
    "numpy>=2.1",
    "pandas>=2.2",
    # PDF
    "jinja2>=3.1",
    "weasyprint>=63.0",
    "markdown-it-py>=3.0",
    # Seguridad
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    # `EmailStr` de pydantic lo pide en tiempo de ejecución, no de import: sin
    # esto el login falla recién cuando alguien intenta loguearse, con un
    # ModuleNotFoundError que no dice nada del login.
    "email-validator>=2.2",
    # Observabilidad
    "langfuse>=2.55",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.19",
    # Utilidades
    "pyyaml>=6.0",
    "python-slugify>=8.0",
    "unidecode>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "vcrpy>=6.0",              # respuestas de LLM grabadas: el CI no gasta
    "faker>=33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasador"]

# ── Lint ──────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff formatea el Python que vive DENTRO de los bloques ```python de un .md.
# Los documentos tienen código alineado a propósito y, peor, salidas de comando
# pegadas como evidencia: reformatearlas las convierte en evidencia falsa.
# Sin esta línea, un `ruff format .` distraído reescribe la documentación.
extend-exclude = ["*.md"]
force-exclude = true          # también cuando se pasa el .md como ruta explícita

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH",
          "RUF", "S", "T20", "ASYNC"]
ignore = ["S101"]              # assert permitido en tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ARG"]
# Los scripts sí imprimen (T20). ASYNC240 avisa de I/O de disco bloqueante
# dentro de una corrutina: correcto en un servidor, irrelevante en un script
# de carga por lotes que corre solo y no compite con nada.
"scripts/*" = ["T20", "ASYNC240"]
# `ops/` es lo mismo que `scripts/` pero para operación: su salida es para una
# persona mirando la consola o para el log del CI. Estaba FUERA del alcance del
# lint —los gates corren sobre `src tests scripts migrations`— así que
# `ops/verificar_imagen.py`, que es un paso del CI, no lo miraba nadie.
"ops/*" = ["T20", "S603", "S607"]
# FastAPI y Alembic imponen la firma de sus callbacks; el argumento no usado
# no es un descuido, es el contrato del framework.
"src/tasador/main.py" = ["ARG001"]
"migrations/env.py" = ["ARG001", "ANN"]
# Las migraciones se versionan tal como salen del autogenerate y NO se
# reformatean: una migración ya aplicada en producción es un hecho histórico, y
# reescribirla para que entre en 100 columnas invita a "arreglarla" de verdad
# algún día. E501 porque los CHECK con vocabularios largos vienen en una línea;
# el resto de las reglas sí corren, y por eso `migrations/` ahora ENTRA al lint
# (antes quedaba afuera y acumulaba 11 errores que nadie veía).
"migrations/versions/*.py" = ["E501", "I001"]
# arq inyecta `ctx` en todo hook y en todo job, se use o no. Es el contrato de
# la cola, igual que el de FastAPI arriba.
"src/tasador/worker.py" = ["ARG001"]
# Es una CLI (`python -m tasador.eval.run`), no una librería: su salida es para
# una persona mirando la consola o para el log del CI. Vive en `src/` y no en
# `scripts/` porque el CI y el Makefile la invocan con `python -m`, que necesita
# que sea un módulo importable.
"src/tasador/eval/run.py" = ["T20"]

# ── Tipos ─────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["crewai.*", "fastembed.*", "weasyprint.*", "pgvector.*"]
ignore_missing_imports = true

# ── Tests ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requiere Postgres y Redis",
    "live: llama a APIs reales y GASTA. No corre en CI",
]
