[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Migraciones ordenadas por fecha: evita colisiones de nombre entre ramas,
# que es exactamente el problema que apareció en el panel de la inmobiliaria cuando
# convivieron feature/whatsapp y master.
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(slug)s

# La URL se inyecta desde el entorno en migrations/env.py.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_fmt
ruff_fmt.type = exec
ruff_fmt.executable = ruff
ruff_fmt.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
